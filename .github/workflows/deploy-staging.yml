name: Deploy to Staging

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 20
  PNPM_VERSION: 9
  DEPLOY_PATH: /www/wwwroot/lms7799

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: self-hosted # 使用自托管 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging
        run: pnpm build:staging

      - name: Deploy to local directory
        run: |
          sudo mkdir -p ${{ env.DEPLOY_PATH }}
          sudo rsync -avz --delete --exclude='uploads/' --exclude='resource/' --exclude='resource-oss/' dist/ ${{ env.DEPLOY_PATH }}/

      - name: Notify deployment success
        if: success()
        run: echo "Staging deployment completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "Staging deployment failed!"
