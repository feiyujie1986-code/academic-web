name: Deploy to Staging

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 20
  PNPM_VERSION: 9
  DEPLOY_PATH: /www/wwwroot/lms7799

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: self-hosted # 使用自托管 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Configure pnpm network
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-mintimeout 10000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set fetch-timeout 120000
          pnpm config set network-concurrency 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging
        run: pnpm build:staging

      - name: Deploy to local directory
        run: |
          mkdir -p ${{ env.DEPLOY_PATH }}
          rsync -rl --delete --exclude='uploads/' --exclude='resource/' --exclude='resource-oss/' dist/ ${{ env.DEPLOY_PATH }}/

      - name: Notify deployment success
        if: success()
        run: echo "Staging deployment completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "Staging deployment failed!"
